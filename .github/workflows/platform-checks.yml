name: Platform checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/user-agent-detection"]

jobs:
  shared-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-react-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run User-Agent regression tests
        run: npm run test:platform
      - name: Build React application
        run: npm run build
