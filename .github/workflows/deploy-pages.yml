name: Deploy Loonakulf Browser demo

on:
  push:
    branches: ["main"]
    paths:
      - "shared-react-ui/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install shared UI dependencies
        working-directory: shared-react-ui
        run: npm install --no-audit --no-fund

      - name: Run platform regression tests
        working-directory: shared-react-ui
        run: npm run test:platform

      - name: Build static React app
        working-directory: shared-react-ui
        env:
          PUBLIC_URL: /loonakulf-browser
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shared-react-ui/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
