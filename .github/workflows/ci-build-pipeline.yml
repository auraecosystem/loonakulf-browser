name: Loonakulf Browser Continuous Integration (CI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python shell dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Install shared UI dependencies
        working-directory: shared-react-ui
        run: npm install --no-audit --no-fund
      - name: Run platform regression tests
        working-directory: shared-react-ui
        run: npm run test:platform
      - name: Build React application
        working-directory: shared-react-ui
        env:
          BROWSERSLIST: ">0.2%, not dead, not op_mini"
          BROWSERSLIST_ENV: production
        run: npm run build

  validate-electron-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Electron JavaScript syntax
        run: |
          node --check electron-shell/main.js
          node --check electron-shell/preload.js
          node --check electron-shell/platform.js
