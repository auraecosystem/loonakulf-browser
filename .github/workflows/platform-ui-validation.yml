name: Platform intelligence and UI validation

on:
  push:
    branches:
      - main
      - feat/platform-intelligence-ua-parser
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Electron JavaScript syntax
        run: |
          node --check electron-shell/main.js
          node --check electron-shell/preload.js
          node --check electron-shell/platform.js
      - name: Install shared UI dependencies
        working-directory: shared-react-ui
        run: npm install --no-audit --no-fund
      - name: Run platform regression tests
        working-directory: shared-react-ui
        run: npm run test:platform
      - name: Build React application
        working-directory: shared-react-ui
        run: npm run build
