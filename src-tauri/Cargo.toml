[package]
name = "loonakulf-browser"
version = "1.0.0"
description = "Loonakulf Bookmarklet Browser"
authors = ["seriki walter yakub"]
edition = "2026"

[lib]
name = "loonakulf_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
