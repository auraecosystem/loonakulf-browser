<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Loonakulf Browser secure request flow</title><desc id="desc">A user action passes through the React UI, typed bridge, native validation and scoped browser operation, with a response or rejection.</desc>
<rect width="1200" height="390" rx="24" fill="#101827"/>
<text x="600" y="52" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">SECURE REQUEST FLOW</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#90aac9" stroke-width="1.5"/></marker></defs>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="125" width="190" height="105" rx="14" fill="#1b5c8a" stroke="#73c7f0"/><text x="130" y="167" fill="white" font-size="20" font-weight="700">User action</text><text x="130" y="195" fill="#d8efff" font-size="14">Intent + consent</text><rect x="275" y="125" width="190" height="105" rx="14" fill="#1b5c8a" stroke="#73c7f0"/><text x="370" y="167" fill="white" font-size="20" font-weight="700">React UI</text><text x="370" y="195" fill="#d8efff" font-size="14">Typed request</text><rect x="515" y="125" width="190" height="105" rx="14" fill="#384c6b" stroke="#a9c1e2"/><text x="610" y="167" fill="white" font-size="20" font-weight="700">Bridge</text><text x="610" y="195" fill="#e1eafa" font-size="14">Version + method</text><rect x="755" y="125" width="190" height="105" rx="14" fill="#654d24" stroke="#e8c77d"/><text x="850" y="167" fill="white" font-size="20" font-weight="700">Native checks</text><text x="850" y="195" fill="#fff0c9" font-size="14">Origin + schema + policy</text><rect x="995" y="125" width="170" height="105" rx="14" fill="#205b4d" stroke="#75d5b6"/><text x="1080" y="167" fill="white" font-size="20" font-weight="700">Browser</text><text x="1080" y="195" fill="#d8fff1" font-size="14">Scoped operation</text></g>
<g stroke="#90aac9" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M225 177 H270"/><path d="M465 177 H510"/><path d="M705 177 H750"/><path d="M945 177 H990"/></g>
<path d="M850 230 V290 H370 V235" fill="none" stroke="#e8a6a6" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<text x="610" y="321" fill="#f2c5c5" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Rejected requests return a structured error to the UI</text>
<text x="600" y="365" fill="#91a6c1" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Security validation is enforced in the native shell, never trusted to the renderer alone.</text>
</svg>