  <rect x="426" y="57" width="170" height="42" rx="11" fill="#142235" stroke="#26384d"/><text x="448" y="83" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">Research</text>
  <text x="86" y="151" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LOONAKULF</text>
  <text x="86" y="179" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Browser</text>
