<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Loonakulf Browser interface concept</title>
  <desc id="desc">A dark desktop browser concept with a tab strip, navigation and address controls, a browser content area, bookmarklet tools, and a privacy-focused status panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1220"/><stop offset="1" stop-color="#111f32"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="54" y="42" width="1332" height="816" rx="24" fill="#0c1727" stroke="#26384d" filter="url(#shadow)"/>
