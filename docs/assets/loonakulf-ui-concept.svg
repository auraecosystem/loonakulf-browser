  <text x="1157" y="235" fill="#8ca2ba" font-family="Arial" font-size="16">☆</text>
  <rect x="1212" y="207" width="142" height="44" rx="13" fill="#1c3447" stroke="#2c5264"/>
  <circle cx="1234" cy="229" r="5" fill="#5eead4"/><text x="1248" y="234" fill="#c9f7ef" font-family="Inter,Arial,sans-serif" font-size="12">Private by default</text>
  <rect x="76" y="278" width="126" height="548" rx="16" fill="#101e30" stroke="#26384d"/>
  <text x="96" y="316" fill="#71869e" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">WORKSPACE</text>
  <rect x="88" y="337" width="102" height="42" rx="10" fill="#183447"/><rect x="101" y="351" width="14" height="14" rx="3" fill="none" stroke="#5eead4" stroke-width="1.6"/><text x="124" y="365" fill="#d9f8f2" font-family="Inter,Arial,sans-serif" font-size="12">Browse</text>
  <g fill="none" stroke="#8298b2" stroke-width="1.6"><path d="M102 408h13v13h-13zM102 457h13v13h-13zM102 506h13v13h-13zM102 555h13v13h-13z"/></g>
  <g fill="#a9bbcf" font-family="Inter,Arial,sans-serif" font-size="12"><text x="124" y="419">Bookmarks</text><text x="124" y="468">Bookmarklets</text><text x="124" y="517">History</text><text x="124" y="566">Settings</text></g>
  <rect x="220" y="278" width="1134" height="548" rx="16" fill="#f3f7fb"/>
  <rect x="220" y="278" width="1134" height="74" rx="16" fill="#e9f0f6"/>
  <text x="264" y="319" fill="#102033" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Your web, in focus.</text>
  <text x="264" y="340" fill="#5b7188" font-family="Inter,Arial,sans-serif" font-size="12">A clean browsing surface with tools available when you need them.</text>
  <rect x="264" y="382" width="700" height="248" rx="18" fill="#ffffff" stroke="#d7e2ec"/>
  <rect x="290" y="408" width="52" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="290" y="451" fill="#13283d" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Welcome to Loonakulf</text>
  <text x="290" y="482" fill="#61758a" font-family="Inter,Arial,sans-serif" font-size="14">A browser experience built around a shared interface</text>
  <text x="290" y="504" fill="#61758a" font-family="Inter,Arial,sans-serif" font-size="14">and platform-native capabilities.</text>
  <rect x="290" y="542" width="156" height="42" rx="10" fill="#102b40"/><text x="312" y="568" fill="#e8fffb" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Explore the web</text>
  <rect x="986" y="382" width="330" height="248" rx="18" fill="#ffffff" stroke="#d7e2ec"/>
  <text x="1014" y="420" fill="#183149" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Browser tools</text>
  <text x="1014" y="447" fill="#71869e" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">QUICK ACCESS</text>
  <rect x="1014" y="465" width="274" height="42" rx="10" fill="#f1f6fa"/><circle cx="1036" cy="486" r="7" fill="#5eead4"/><text x="1054" y="491" fill="#29445d" font-family="Inter,Arial,sans-serif" font-size="13">Saved bookmarklets</text>
  <rect x="1014" y="517" width="274" height="42" rx="10" fill="#f1f6fa"/><circle cx="1036" cy="538" r="7" fill="#60a5fa"/><text x="1054" y="543" fill="#29445d" font-family="Inter,Arial,sans-serif" font-size="13">Privacy and permissions</text>
  <text x="264" y="681" fill="#28445e" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">Your tools</text>
  <rect x="264" y="701" width="332" height="92" rx="14" fill="#ffffff" stroke="#d7e2ec"/><text x="286" y="735" fill="#183149" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Bookmarklets</text><text x="286" y="760" fill="#71869e" font-family="Inter,Arial,sans-serif" font-size="12">Run saved actions with explicit permission.</text>
  <rect x="612" y="701" width="352" height="92" rx="14" fill="#ffffff" stroke="#d7e2ec"/><text x="634" y="735" fill="#183149" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Platform identity</text><text x="634" y="760" fill="#71869e" font-family="Inter,Arial,sans-serif" font-size="12">Understand the active shell and rendering engine.</text>
  <rect x="986" y="701" width="330" height="92" rx="14" fill="#ffffff" stroke="#d7e2ec"/><text x="1008" y="735" fill="#183149" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Security controls</text><text x="1008" y="760" fill="#71869e" font-family="Inter,Arial,sans-serif" font-size="12">Keep privileged actions scoped and visible.</text>
  <text x="86" y="842" fill="#60758d" font-family="Inter,Arial,sans-serif" font-size="10">CONCEPT UI · NOT A SCREENSHOT OF THE CURRENT BUILD</text>
</svg>